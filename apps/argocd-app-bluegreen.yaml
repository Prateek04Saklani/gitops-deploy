apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-bluegreen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Prateek04Saklani/gitops-deploy.git
    targetRevision: main
    path: blue-green
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
